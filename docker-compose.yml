version: "3.8"

services:
  api:
    build: .
    container_name: railniyam-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  ui:
    build: .
    container_name: railniyam-ui
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - API_BASE_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped

